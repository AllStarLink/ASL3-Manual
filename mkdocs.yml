site_name: AllStarLink Manual
site_url: https://allstarlink.github.io/
site_description: AllStarLink Manual
site_author: AllStarLink Team
plugins:
  - search
  - glightbox
  - print-site
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
copyright: Copyright &copy; 2024-2026 AllStarLink Inc.
theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  logo: assets/allstar-logo-small.png
  favicon: assets/allstarlink.png
  palette:
    scheme: allstarlink
extra_css:
  - stylesheets/extra.css
extra:
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    actions:
      - accept
      - reject
  social:
    - icon: fontawesome/solid/link
      link: https://www.allstarlink.org/
      name: AllStarLink Home
    - icon: fontawesome/brands/github
      link: https://github.com/AllStarLink
      name: AllStarLink on GitHub
